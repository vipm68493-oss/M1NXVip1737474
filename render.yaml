services:
  - type: web
    name: m1nx-bot-hosting
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_PASSWORD
        value: owner
      - key: OWNER_ID
        value: "7765423734"